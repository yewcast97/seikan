[package]
name = "seikan-turtle"
description = "The Turtle position-management kernel behind `seikan stock-turtle-trade-long-only`: Wilder ATR, lowest-low channel, the long-only state machine and its reference simulator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "seikan_turtle"
# rlib: `cargo test` and any Rust consumer link the pure kernel without Python;
# cdylib: maturin builds the `seikan._turtle` extension module from the same crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py313"], optional = true }

[features]
default = []
# The PyO3 bindings (`src/py.rs`). Off by default so the kernel compiles and tests with no
# Python interpreter; maturin enables `extension-module`, which implies it.
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
