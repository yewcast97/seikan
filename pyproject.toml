[project]
name = "seikan"
version = "4.0.0"
description = "Stateless CLI statistical reporter: observer-pure forward-return event studies with a per-cell checklist, over strict CSV data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yewcast97" }]
requires-python = ">=3.13"
keywords = ["backtesting", "event-study", "statistics", "finance", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    # numpy for the vectorized kernels, numba for the recursive ones (ema, first_true,
    # bars_since_extremum), scipy for skewness/kurtosis, Spearman and cross_rank's rankdata.
    "numba>=0.60",
    "scipy>=1.13",
    "numpy>=2",
    # pandas 3 parses each stamp at its own resolution (a second-stamped file builds a `[us]`
    # index), which the clock arithmetic and stamps past 2262 rely on.
    "pandas>=3",
    # The thesis DSL and the SEIKAN_* gate-threshold settings.
    "pydantic>=2",
    "pydantic-settings>=2.5",
]

[project.urls]
Repository = "https://github.com/yewcast97/seikan"

[project.scripts]
seikan = "seikan.cli:main"

[build-system]
# Pure-Python package (no compiled extensions); a plain setuptools backend is enough.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The DSL guide `seikan schema --markdown` reads out of the installed package, and the PEP 561
# `py.typed` marker that makes the annotations a downstream type checker's authority (CI checks
# the wheel carries both).
[tool.setuptools.package-data]
"seikan" = ["reference/*.md", "py.typed"]

[tool.pytest.ini_options]
# Warnings are errors: the engine's numerics are warning-free by design, so a warning is a
# regression.
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mypy>=1.14",
    "ruff>=0.9",
]

# Strict mypy is what makes the `py.typed` marker's claim true.
[tool.mypy]
python_version = "3.13"
files = ["src/seikan"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# numba, scipy and pandas ship no stubs of their own (pandas-stubs is a third-party
# approximation less precise than the library, answerable only with casts). The waiver covers the
# import only: seikan's own signatures still state every frame and array they take and return.
[[tool.mypy.overrides]]
module = ["numba.*", "scipy.*", "pandas.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Formatting is enforced (`ruff format --check` is part of the dev loop below), with ruff's
# defaults stated explicitly so a reformat can never arrive as a surprise.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# The prose uses real typography (em dashes, `×`, `≥`/`≤`), which the ambiguous-unicode rules
# read as homoglyph typos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests name fixtures after the statistical objects they build (`T`, `X`, `HAC`), where the
# convention the maths uses beats the convention the linter wants.
"tests/**" = ["N806", "N803"]
